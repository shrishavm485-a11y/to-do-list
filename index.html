<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dō — To-Do</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e10;
      --surface: #18181c;
      --surface2: #222228;
      --border: rgba(255,255,255,0.07);
      --accent: #c8f07a;
      --accent-dim: rgba(200,240,122,0.12);
      --text: #f0ede6;
      --muted: #7a7875;
      --done-color: #3d3d44;
      --danger: #ff5f5f;
      --radius: 16px;
      --font-serif: 'DM Serif Display', Georgia, serif;
      --font-sans: 'DM Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px 80px;
    }

    /* Ambient blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 480px; height: 480px;
      background: radial-gradient(circle, rgba(200,240,122,0.07) 0%, transparent 70%);
      top: -120px; right: -100px;
    }
    body::after {
      width: 360px; height: 360px;
      background: radial-gradient(circle, rgba(120,100,255,0.06) 0%, transparent 70%);
      bottom: 0; left: -80px;
    }

    .app {
      width: 100%;
      max-width: 560px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      margin-bottom: 36px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .logo {
      font-family: var(--font-serif);
      font-size: 42px;
      line-height: 1;
      color: var(--text);
      letter-spacing: -1px;
    }
    .logo span { color: var(--accent); font-style: italic; }
    .date-badge {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      margin-top: 8px;
    }
    .header-sub {
      font-size: 13px;
      color: var(--muted);
      font-weight: 300;
    }
    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      background: var(--surface2);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      width: 0%;
      transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    .progress-text {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      min-width: 60px;
      text-align: right;
    }

    /* Input area */
    .input-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 6px 6px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    .input-card:focus-within {
      border-color: rgba(200,240,122,0.35);
    }
    .input-card input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      font-family: var(--font-sans);
      font-size: 15px;
      color: var(--text);
      font-weight: 300;
    }
    .input-card input::placeholder { color: var(--muted); }

    .priority-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-family: var(--font-sans);
      font-size: 12px;
      padding: 6px 10px;
      outline: none;
      cursor: pointer;
    }
    .priority-select option { background: #222228; }

    .add-btn {
      background: var(--accent);
      color: #111;
      border: none;
      border-radius: 10px;
      width: 40px; height: 40px;
      font-size: 22px;
      font-weight: 300;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, opacity 0.15s;
    }
    .add-btn:hover { transform: scale(1.07); }
    .add-btn:active { transform: scale(0.95); }

    /* Filter bar */
    .filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
    }
    .filter-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 99px;
      color: var(--muted);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 16px;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.03em;
    }
    .filter-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    .filter-btn.active {
      background: var(--accent-dim);
      border-color: rgba(200,240,122,0.4);
      color: var(--accent);
    }
    .filter-spacer { flex: 1; }
    .clear-btn {
      background: none;
      border: 1px solid rgba(255,95,95,0.2);
      border-radius: 99px;
      color: rgba(255,95,95,0.6);
      font-family: var(--font-sans);
      font-size: 12px;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .clear-btn:hover { border-color: var(--danger); color: var(--danger); }

    /* Task list */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: default;
      transition: border-color 0.2s, transform 0.15s, opacity 0.3s;
      animation: slide-in 0.3s cubic-bezier(0.4,0,0.2,1) both;
      position: relative;
      overflow: hidden;
    }
    .task-item:hover { border-color: rgba(255,255,255,0.14); }
    .task-item.done { opacity: 0.5; }
    .task-item.done .task-text { text-decoration: line-through; color: var(--muted); }

    /* Priority accent stripe */
    .task-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      border-radius: 99px 0 0 99px;
    }
    .task-item.prio-high::before   { background: #ff5f5f; }
    .task-item.prio-medium::before { background: #f0a030; }
    .task-item.prio-low::before    { background: var(--accent); }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-out {
      to { opacity: 0; transform: translateX(-12px); }
    }
    .task-item.removing {
      animation: fade-out 0.25s ease forwards;
    }

    /* Checkbox */
    .check-wrap {
      flex-shrink: 0;
      width: 22px; height: 22px;
      position: relative;
      cursor: pointer;
    }
    .check-wrap input {
      position: absolute;
      opacity: 0; width: 100%; height: 100%; cursor: pointer; margin: 0; z-index: 1;
    }
    .check-box {
      width: 22px; height: 22px;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, border-color 0.2s;
      background: transparent;
    }
    .check-wrap input:checked ~ .check-box {
      background: var(--accent);
      border-color: var(--accent);
    }
    .check-box svg { display: none; }
    .check-wrap input:checked ~ .check-box svg { display: block; }

    .task-content { flex: 1; min-width: 0; }
    .task-text {
      font-size: 15px;
      font-weight: 400;
      color: var(--text);
      line-height: 1.4;
      transition: color 0.2s;
    }
    .task-meta {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      align-items: center;
    }
    .prio-tag {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 99px;
    }
    .prio-high   .prio-tag { background: rgba(255,95,95,0.12);  color: #ff7575; }
    .prio-medium .prio-tag { background: rgba(240,160,48,0.12); color: #f0b050; }
    .prio-low    .prio-tag { background: rgba(200,240,122,0.1); color: #a8c860; }

    .task-time {
      font-size: 11px;
      color: var(--muted);
    }

    .task-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .task-item:hover .task-actions { opacity: 1; }

    .action-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--muted);
      font-size: 14px;
      transition: all 0.15s;
    }
    .action-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); background: var(--surface2); }
    .action-btn.del:hover { border-color: rgba(255,95,95,0.4); color: var(--danger); }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      display: none;
    }
    .empty-state.visible { display: block; }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.3;
    }
    .empty-state p {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 18px;
      color: var(--muted);
    }

    /* Stats footer */
    .stats-row {
      display: flex;
      gap: 20px;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .stat { text-align: center; }
    .stat-num {
      font-family: var(--font-serif);
      font-size: 28px;
      color: var(--text);
      line-height: 1;
    }
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .stat-spacer { flex: 1; }

    /* Drag styles */
    .task-item.dragging {
      opacity: 0.4;
      border: 1px dashed rgba(200,240,122,0.4);
    }
    .task-item.drag-over {
      border-color: rgba(200,240,122,0.5);
      transform: scale(1.01);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 99px; }

    @media (max-width: 480px) {
      .logo { font-size: 34px; }
      .filter-bar { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="header-top">
      <div class="logo">D<span>ō</span></div>
      <div class="date-badge" id="date-badge"></div>
    </div>
    <div class="header-sub">What needs to be done?</div>
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-text" id="progress-text">0 / 0 done</div>
    </div>
  </header>

  <!-- Input -->
  <div class="input-card">
    <input type="text" id="task-input" placeholder="Add a new task…" autocomplete="off" maxlength="120"/>
    <select class="priority-select" id="priority-select">
      <option value="low">🟢 Low</option>
      <option value="medium" selected>🟡 Medium</option>
      <option value="high">🔴 High</option>
    </select>
    <button class="add-btn" id="add-btn" aria-label="Add task">+</button>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="done">Done</button>
    <div class="filter-spacer"></div>
    <button class="clear-btn" id="clear-done-btn">Clear done</button>
  </div>

  <!-- Tasks -->
  <div class="task-list" id="task-list"></div>

  <!-- Empty state -->
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">✦</div>
    <p>All clear. Enjoy the stillness.</p>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat">
      <div class="stat-num" id="stat-total">0</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-active">0</div>
      <div class="stat-label">Active</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-done">0</div>
      <div class="stat-label">Done</div>
    </div>
    <div class="stat-spacer"></div>
  </div>

</div>

<script>
  // ── State ──────────────────────────────────────────────────────
  let tasks = JSON.parse(localStorage.getItem('do-tasks') || '[]');
  let filter = 'all';
  let dragSrc = null;

  // ── Helpers ────────────────────────────────────────────────────
  function save() {
    localStorage.setItem('do-tasks', JSON.stringify(tasks));
  }

  function formatTime(ts) {
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  // ── Date badge ─────────────────────────────────────────────────
  function setDate() {
    const now = new Date();
    const opts = { weekday: 'short', month: 'short', day: 'numeric' };
    document.getElementById('date-badge').textContent =
      now.toLocaleDateString('en-US', opts).toUpperCase();
  }
  setDate();

  // ── Add task ───────────────────────────────────────────────────
  function addTask() {
    const input = document.getElementById('task-input');
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    const prio = document.getElementById('priority-select').value;
    tasks.unshift({ id: uid(), text, done: false, priority: prio, createdAt: Date.now() });
    save();
    render();
    input.value = '';
    input.focus();
  }

  document.getElementById('add-btn').addEventListener('click', addTask);
  document.getElementById('task-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  // ── Toggle done ───────────────────────────────────────────────
  function toggleDone(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  // ── Delete ────────────────────────────────────────────────────
  function deleteTask(id) {
    const el = document.querySelector(`[data-id="${id}"]`);
    if (el) {
      el.classList.add('removing');
      el.addEventListener('animationend', () => {
        tasks = tasks.filter(t => t.id !== id);
        save(); render();
      }, { once: true });
    }
  }

  // ── Edit ──────────────────────────────────────────────────────
  function editTask(id) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    const newText = prompt('Edit task:', t.text);
    if (newText !== null && newText.trim()) {
      t.text = newText.trim();
      save(); render();
    }
  }

  // ── Clear done ────────────────────────────────────────────────
  document.getElementById('clear-done-btn').addEventListener('click', () => {
    tasks = tasks.filter(t => !t.done);
    save(); render();
  });

  // ── Filter ────────────────────────────────────────────────────
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      filter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  // ── Drag & drop reorder ───────────────────────────────────────
  function attachDrag(el, id) {
    el.setAttribute('draggable', 'true');
    el.addEventListener('dragstart', e => {
      dragSrc = id;
      setTimeout(() => el.classList.add('dragging'), 0);
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      document.querySelectorAll('.task-item').forEach(i => i.classList.remove('drag-over'));
    });
    el.addEventListener('dragover', e => {
      e.preventDefault();
      if (dragSrc !== id) el.classList.add('drag-over');
    });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', e => {
      e.preventDefault();
      if (dragSrc === id) return;
      const fromIdx = tasks.findIndex(t => t.id === dragSrc);
      const toIdx   = tasks.findIndex(t => t.id === id);
      if (fromIdx === -1 || toIdx === -1) return;
      const [moved] = tasks.splice(fromIdx, 1);
      tasks.splice(toIdx, 0, moved);
      save(); render();
    });
  }

  // ── Render ────────────────────────────────────────────────────
  function render() {
    const list = document.getElementById('task-list');
    const empty = document.getElementById('empty-state');

    const visible = tasks.filter(t => {
      if (filter === 'active') return !t.done;
      if (filter === 'done')   return t.done;
      return true;
    });

    list.innerHTML = '';

    if (visible.length === 0) {
      empty.classList.add('visible');
    } else {
      empty.classList.remove('visible');
      visible.forEach(t => {
        const item = document.createElement('div');
        item.className = `task-item prio-${t.priority}${t.done ? ' done' : ''}`;
        item.dataset.id = t.id;
        item.innerHTML = `
          <label class="check-wrap" title="Toggle done">
            <input type="checkbox" ${t.done ? 'checked' : ''}/>
            <div class="check-box">
              <svg width="12" height="9" viewBox="0 0 12 9" fill="none">
                <path d="M1 4L4.5 7.5L11 1" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </label>
          <div class="task-content">
            <div class="task-text">${escHtml(t.text)}</div>
            <div class="task-meta">
              <span class="prio-tag">${t.priority}</span>
              <span class="task-time">${formatTime(t.createdAt)}</span>
            </div>
          </div>
          <div class="task-actions">
            <button class="action-btn edit" title="Edit" aria-label="Edit task">✎</button>
            <button class="action-btn del" title="Delete" aria-label="Delete task">✕</button>
          </div>
        `;

        item.querySelector('input[type=checkbox]').addEventListener('change', () => toggleDone(t.id));
        item.querySelector('.edit').addEventListener('click', e => { e.stopPropagation(); editTask(t.id); });
        item.querySelector('.del').addEventListener('click', e => { e.stopPropagation(); deleteTask(t.id); });

        attachDrag(item, t.id);
        list.appendChild(item);
      });
    }

    // Progress & stats
    const total  = tasks.length;
    const done   = tasks.filter(t => t.done).length;
    const active = total - done;
    const pct    = total ? Math.round((done / total) * 100) : 0;

    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-text').textContent = `${done} / ${total} done`;
    document.getElementById('stat-total').textContent  = total;
    document.getElementById('stat-active').textContent = active;
    document.getElementById('stat-done').textContent   = done;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init ──────────────────────────────────────────────────────
  render();
</script>
</body>
</html>
